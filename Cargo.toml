[package]
name = "solidity-language-server"
description = "A Solidity language server powered by tree-sitter."
version = "0.1.15"
edition = "2024"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/mmsaki/solidity-language-server"
repository = "https://github.com/mmsaki/solidity-language-server"
keywords = ["language-server", "solidity", "lsp"]
exclude = ["pool-manager-ast.json", "v4-core"]

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
eyre = "0.6.12"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tower-lsp = "0.20.0"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
tree-sitter = "0.25"
tree-sitter-solidity = "1.2"
solar = { version = "=0.1.8", package = "solar-compiler", default-features = false }
toml = "0.8"
tempfile = "3.23.0"
